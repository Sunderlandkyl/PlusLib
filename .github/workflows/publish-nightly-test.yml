name: Publish nightly release (test)

# Exercises publish-nightly.yml with fake installers. Fork testing only.

on:
  workflow_dispatch:

jobs:
  fake_build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        archive-name:
          - PlusApp-Win64
          - PlusApp-Win32
          - PlusApp-Clarius-Win64
          - PlusApp-ClariusOEM-Win64
          - PlusApp-Telemed-Win64
          - PlusApp-spryTrack-Telemed-Win64
          - PlusApp-fusionTrack-Win64
          - PlusApp-MicronTracker-4.1-Win64
          - PlusApp-Thorlabs-Win32
          - PlusApp-Interson-Win32
          - PlusApp-Telemed-Win32
    steps:
    - name: Create fake installer
      run: |
        mkdir out
        name=$(sed 's/^PlusApp-/PlusApp-2.9.0.'"$(date -u +%Y%m%d)"'-/' <<< "${{ matrix.archive-name }}")
        head -c 1048576 /dev/urandom > "out/$name.exe"
        ls -l out
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.archive-name }}
        path: out/*.exe

  publish:
    needs: [fake_build]
    uses: ./.github/workflows/publish-nightly.yml
    permissions:
      contents: write
