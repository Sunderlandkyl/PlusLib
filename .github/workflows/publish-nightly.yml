name: Publish nightly release

# Uploads the installers built by the calling workflow to the pre-release of
# the current development version, replacing the previous night's installers.
#
# The pre-release is tagged Plus-<major>.<minor>.0 from the version in
# CMakeLists.txt, like the stable releases, so a new one starts automatically
# when the version is bumped after a stable release. The tag never moves; the
# commit that the installers were built from is recorded in the release notes.

on:
  workflow_call:
    inputs:
      # Name pattern of the artifacts that hold the installers. Each artifact
      # is expected to contain a single installer, which is published under
      # its own name (e.g. PlusApp-2.9.0.20261007-Win64.exe).
      artifact-pattern:
        required: false
        type: string
        default: PlusApp-*

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # Only CMakeLists.txt is needed, for the version number.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: CMakeLists.txt
        sparse-checkout-cone-mode: false

    - name: Download installers
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: installers

    - name: Publish installers
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        major=$(sed -n 's/^SET(PLUSLIB_VERSION_MAJOR "\([0-9]*\)")/\1/p' CMakeLists.txt)
        minor=$(sed -n 's/^SET(PLUSLIB_VERSION_MINOR "\([0-9]*\)")/\1/p' CMakeLists.txt)
        if [ -z "$major" ] || [ -z "$minor" ]; then
          echo "Could not read PLUSLIB_VERSION_MAJOR/MINOR from CMakeLists.txt"
          exit 1
        fi
        version="$major.$minor.0"
        tag="Plus-$version"

        # One installer per artifact.
        mkdir upload
        for dir in installers/*/; do
          exe=$(find "$dir" -maxdepth 1 -name '*.exe' | head -n 1)
          if [ -z "$exe" ]; then
            echo "Artifact $(basename "$dir") contains no installer"
            exit 1
          fi
          cp "$exe" upload/
        done
        ls -l upload

        if ! gh release view "$tag" >/dev/null 2>&1; then
          echo "Creating pre-release $tag"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "$tag" --notes "Development snapshot of Plus $version."
        fi

        # The download counts of the installers are lost when they are
        # removed, so they are recorded in a CSV file kept as an asset of the
        # release. A new release takes over the file from the previous one.
        stats=download-stats.csv
        prev=$(gh api "repos/$GH_REPO/releases?per_page=100" \
          --jq "first(.[] | select(any(.assets[]; .name == \"$stats\")) | .tag_name)")
        if [ -n "$prev" ]; then
          gh release download "$prev" --pattern "$stats" --dir upload
        else
          echo "date,installer,downloads" > "upload/$stats"
        fi
        gh release view "$tag" --json assets \
          --jq ".assets[] | select(.name | endswith(\".exe\")) | \"$(date -u +%Y-%m-%d),\(.name),\(.download_count)\"" \
          >> "upload/$stats"
        tail -n 12 "upload/$stats"

        # Upload tonight's installers, then remove the previous night's.
        # --clobber covers a second run on the same day.
        gh release upload "$tag" upload/* --clobber
        for old in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
          if [ ! -e "upload/$old" ]; then
            echo "Removing $old"
            gh release delete-asset "$tag" "$old" --yes
          fi
        done

        repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        cat > notes.md <<EOF
        Development snapshot of Plus $version, rebuilt every night from the master branch.

        - Commit: [${GITHUB_SHA:0:8}]($repo_url/commit/$GITHUB_SHA)
        - Built: $(date -u +'%Y-%m-%d %H:%M UTC') ([workflow run]($repo_url/actions/runs/$GITHUB_RUN_ID))

        The installers below replace the previous night's; $stats records how many times each night's installers were downloaded. The *Source code* links refer to the start of the $version development cycle, not to this snapshot; use the commit above instead.
        EOF
        gh release edit "$tag" --prerelease --notes-file notes.md
