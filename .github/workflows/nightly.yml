name: Nightly

on:
  workflow_dispatch:
    inputs:
      clear-plus-cache:
        description: 'Clear the cached Plus build directory before building'
        required: false
        type: boolean
        default: false
      publish-release:
        description: 'Upload the installers to the development pre-release, as a scheduled run does'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "43 5 * * *" # Run nightly at 5:43 UTC. Picked a time when the load may be lower. https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule

jobs:
  ########
  # BUILD
  build:
    uses: ./.github/workflows/build-packages.yml
    secrets:
      pltools-access-token: ${{ secrets.PLTOOLS_ACCESS_TOKEN }}
    with:
      pluslib-tag: ${{ github.sha }}
      # actions/cache never overwrites a key once created, so clear the Plus
      # build directories every night (and on demand via the clear-plus-cache
      # input) to avoid an arbitrarily stale build directory sticking around
      # forever.
      clear-plus-cache: ${{ github.event_name == 'schedule' || inputs.clear-plus-cache == true }}
      dashboard-model: ${{ github.event_name == 'schedule' && 'Nightly' || 'Experimental' }}

  ########
  # PUBLISH
  ########
  # Replace the installers of the development pre-release with tonight's.
  # Runs even if some builds failed; their installers of a previous night
  # stay on the release.
  publish_release:
    needs: [build]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.publish-release == true) }}
    uses: ./.github/workflows/publish-nightly.yml
    permissions:
      contents: write
    secrets:
      LEDGER_TOKEN: ${{ secrets.PLUSLIBDATA_TOKEN }}

  # Record the download counts of the installers of the releases. The ones of
  # the development pre-release are recorded by the publish job instead.
  record_downloads:
    if: ${{ github.event_name == 'schedule' }}
    uses: ./.github/workflows/record-downloads.yml
    secrets:
      LEDGER_TOKEN: ${{ secrets.PLUSLIBDATA_TOKEN }}
