name: Build VTK

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      build-type:
          required: false
          type: string
          default: Release
      vtk-hash:
        required: true
        type: string
      build-options:
        required: false
        type: string
      cache-prefix:
        required: false
        type: string
        default: vtk

    outputs:
      cache-key:
        value: ${{ jobs.vtk.outputs.cache-key }}
      install-path:
        value: ${{ jobs.vtk.outputs.install-path }}

jobs:
  vtk:
    runs-on: ${{ inputs.os }}
    outputs:
      cache-key: ${{ steps.set-outputs.outputs.cache-key }}
      install-path: ${{ steps.set-outputs.outputs.install-path }}
    env:
      CACHE_KEY: ${{ inputs.cache-prefix }}-${{ inputs.os }}-${{ inputs.arch }}-${{ inputs.vtk-hash }}
      # The open-source Qt 5.15 binaries are x86_64 only, so an Apple silicon
      # runner builds for x86_64 throughout.
      CMAKE_OSX_ARCHITECTURES: ${{ contains(inputs.os, 'macos') && 'x86_64' || '' }}

    steps:
      - name: Cache VTK Build
        id: cache-vtk
        uses: actions/cache@v6
        with:
          path: vtk-install
          lookup-only: true
          key: ${{ env.CACHE_KEY }}

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux' && steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ make libgl1-mesa-dev libglu1-mesa-dev libxt-dev libxrender-dev libxext-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS' && steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          brew install ninja
          # Needed to run the x86_64 Qt tools on Apple silicon.
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: 4.3.4

      - name: Install Qt
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          dir: ${{github.workspace}}/Qt
          version: '5.15.0'
          arch: ${{ runner.os == 'Windows' && (inputs.arch == 'x64' && 'win64_msvc2019_64' || 'win32_msvc2019') || runner.os == 'Linux' && 'gcc_64' || 'clang_64' }}

      - name: Clone VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir vtk
          cd vtk
          git init
          git remote add origin https://gitlab.kitware.com/vtk/vtk.git
          git fetch --depth 1 origin ${{ inputs.vtk-hash }}
          git checkout FETCH_HEAD

      - name: Configure VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          # Visual Studio on Windows, Ninja elsewhere.
          generator=(-G Ninja)
          if [ "$RUNNER_OS" = "Windows" ]; then
            generator=(-G "Visual Studio 18 2026" -A "${{ inputs.arch }}")
          fi
          cmake -S vtk -B vtk-build "${generator[@]}" \
            -DCMAKE_INSTALL_PREFIX=vtk-install \
            -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} \
            -DBUILD_SHARED_LIBS=ON \
            -DVTK_BUILD_TESTING=OFF \
            -DVTK_VERSIONED_INSTALL=OFF \
            -DVTK_GROUP_ENABLE_Qt:STRING=YES \
            -DQt5_DIR="${QT_ROOT_DIR}/lib/cmake/Qt5" \
            ${{ inputs.build-options }}

      - name: Build VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --build vtk-build --parallel 4 --config ${{ inputs.build-type }}

      - name: Install VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --install vtk-build --config ${{ inputs.build-type }}

      - name: Set Outputs
        id: set-outputs
        shell: bash
        run: |
          echo "cache-key=$CACHE_KEY" >> $GITHUB_OUTPUT
          INSTALL_PATH="$GITHUB_WORKSPACE/vtk-install/lib/cmake/vtk"
          echo "install-path=$INSTALL_PATH" >> $GITHUB_OUTPUT