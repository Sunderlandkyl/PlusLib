      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    secrets:
      pltools-access-token: ${{ secrets.pltools-access-token }}
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      pluslib-repository: https://github.com/${{ github.repository }}.git
