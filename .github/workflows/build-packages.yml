name: Build packages

# Builds the Plus installers (the PlusApp packages of every edition), each
# uploaded as an artifact named after the package (e.g. PlusApp-Win64).

on:
  workflow_call:
    inputs:
      pluslib-tag:
        description: 'PlusLib branch, tag or commit'
        required: true
        type: string
      plusapp-tag:
        description: 'PlusApp branch, tag or commit'
        required: false
        type: string
        default: master
      plusbuild-tag:
        description: 'PlusBuild branch, tag or commit'
        required: false
        type: string
        default: master
      plus-cache-key-prefix:
        description: 'Prefix of the keys of the cached Plus build directories (one per architecture)'
        required: false
        type: string
        default: plus-latest
      clear-plus-cache:
        description: 'Clear the cached Plus build directories before building'
        required: false
        type: boolean
        default: false
      dashboard-model:
        description: 'CDash model the builds are submitted to (Experimental, Nightly or Continuous)'
        required: false
        type: string
        default: Experimental
    secrets:
      pltools-access-token:
        required: true

jobs:
  ########
  # BUILD AND CACHE VTK
  update_vtk_x64:
    uses: ./.github/workflows/build-vtk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    with:
      vtk-hash: f49a1dbafa60b58ef22f6292ec58370453162192 # v9.6.2
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  update_vtk_Win32:
    uses: ./.github/workflows/build-vtk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [Win32]
    with:
      vtk-hash: f49a1dbafa60b58ef22f6292ec58370453162192 # v9.6.2
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  ########
  # BUILD AND CACHE ITK
  update_itk_x64:
    uses: ./.github/workflows/build-itk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    with:
      itk-hash: f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158 # v5.4.6
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  update_itk_Win32:
    uses: ./.github/workflows/build-itk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [Win32]
    with:
      itk-hash: f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158 # v5.4.6
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  build_plus_x64:
    needs: [update_vtk_x64, update_itk_x64]
    uses: ./.github/workflows/build-plus.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    secrets:
      pltools-access-token: ${{ secrets.pltools-access-token }}
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      pluslib-repository: https://github.com/${{ github.repository }}.git
      pluslib-tag: ${{ inputs.pluslib-tag }}
      plusapp-tag: ${{ inputs.plusapp-tag }}
      plusbuild-tag: ${{ inputs.plusbuild-tag }}
      use-pltools: true
      vtk-cache-key: ${{ needs.update_vtk_x64.outputs.cache-key }}
      itk-cache-key: ${{ needs.update_itk_x64.outputs.cache-key }}
      plus-cache-key: ${{ inputs.plus-cache-key-prefix }}-x64
      clear-plus-cache: ${{ inputs.clear-plus-cache }}
      dashboard-model: ${{ inputs.dashboard-model }}
      archive-name: PlusApp-Win64
      plus-config: >-
        -DVTK_DIR=${{ needs.update_vtk_x64.outputs.install-path }}
        -DITK_DIR=${{ needs.update_itk_x64.outputs.install-path }}
        -DPLUSBUILD_BUILDNAME_POSTFIX=gh-package-x64
        -DPLUS_USE_3dConnexion_TRACKER:BOOL=ON
        -DPLUS_USE_Ascension3DGm:BOOL=OFF
        -DPLUS_USE_BKPROFOCUS_VIDEO:BOOL=OFF
        -DPLUS_USE_EPIPHAN:BOOL=ON
        -DPLUS_USE_ICCAPTURING_VIDEO:BOOL=OFF
        -DPLUS_USE_PHIDGET_SPATIAL_TRACKER:BOOL=ON
        -DPLUS_USE_NDI:BOOL=ON
        -DPLUS_USE_VFW_VIDEO:BOOL=ON
        -DPLUS_USE_OPTITRACK:BOOL=ON
        -DPLUS_USE_INTELREALSENSE:BOOL=ON
        -DPLUSBUILD_PREFER_MicronTracker_36:BOOL=OFF
        -DPLUS_USE_TextRecognizer:BOOL=ON
        -DPLUS_USE_WITMOTIONTRACKER:BOOL=ON
        -DPLUS_USE_MKV_IO:BOOL=ON
        -DPLUS_ENABLE_VIDEOSTREAMING:BOOL=ON
        -DPLUS_USE_VP9:BOOL=ON
        -DPLUS_USE_Ascension3DG:BOOL=OFF
        -DPLUS_USE_BRACHY_TRACKER:BOOL=OFF
        -DPLUS_USE_NDI_CERTUS:BOOL=OFF
        -DPLUS_USE_ULTRASONIX_VIDEO:BOOL=OFF
        -DPLUS_USE_INTERSON_VIDEO:BOOL=OFF
        -DPLUS_USE_MICRONTRACKER:BOOL=OFF
        -DPLUS_USE_MMF_VIDEO:BOOL=ON
        -DPLUS_USE_STEALTHLINK:BOOL=OFF
        -DPLUS_USE_OPTICAL_MARKER_TRACKER:BOOL=ON
        -DPLUSBUILD_USE_OpenCV:BOOL=ON
        -DPLUS_USE_OpenCV_VIDEO:BOOL=ON
        -DPLUSBUILD_USE_aruco:BOOL=ON

