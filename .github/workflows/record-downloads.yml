name: Record downloads

# Records the download counts of the installers of a release in a CSV file
# kept on the download-stats release of PlusToolkit/PlusLibData (see
# .github/scripts/record-downloads.py). Call it from a scheduled workflow to
# sample the downloads of a stable release, e.g. every night.

on:
  workflow_call:
    inputs:
      release:
        description: 'Tag of the release whose installers are counted'
        required: true
        type: string
      row:
        description: 'Key the row by today or by the build date of the installers'
        required: false
        type: string
        default: today
      ledger-repo:
        description: 'Repository of the release that holds the CSV files (default: PlusLibData of the same owner)'
        required: false
        type: string
        default: ''
      ledger-release:
        description: 'Tag of the release that holds the CSV files'
        required: false
        type: string
        default: download-stats
    secrets:
      LEDGER_TOKEN:
        description: 'Token with write access to the contents of the ledger repository'
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag of the release whose installers are counted'
        required: true
        type: string
      row:
        description: 'Key the row by today or by the build date of the installers'
        required: false
        type: choice
        options: [today, build]
        default: today
      ledger-repo:
        description: 'Repository of the release that holds the CSV files (default: PlusLibData of the same owner)'
        required: false
        type: string
        default: ''
      ledger-release:
        description: 'Tag of the release that holds the CSV files'
        required: false
        type: string
        default: download-stats

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts/record-downloads.py
        sparse-checkout-cone-mode: false

    - name: Record downloads
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN || secrets.PLUSLIBDATA_TOKEN }}
      run: >
        python3 .github/scripts/record-downloads.py
        --release '${{ inputs.release }}'
        --row '${{ inputs.row }}'
        --ledger-repo '${{ inputs.ledger-repo || format('{0}/PlusLibData', github.repository_owner) }}'
        --ledger-release '${{ inputs.ledger-release }}'
