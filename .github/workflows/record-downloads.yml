name: Record downloads

# Records the download counts of the installers of a release in the CSV file
# kept as an asset of the release (see .github/scripts/record-downloads.py).
# Call it from a scheduled workflow to sample the downloads of a stable
# release, e.g. every night.

on:
  workflow_call:
    inputs:
      release:
        description: 'Tag of the release whose installers are counted'
        required: true
        type: string
      ledger:
        description: 'Tag of the release that holds the CSV file (default: the same release)'
        required: false
        type: string
        default: ''
      row:
        description: 'Key the row by today or by the build date of the installers'
        required: false
        type: string
        default: today
      inherit:
        description: 'Continue the CSV file of the newest release that has one, if the ledger release has none'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag of the release whose installers are counted'
        required: true
        type: string
      ledger:
        description: 'Tag of the release that holds the CSV file (default: the same release)'
        required: false
        type: string
        default: ''
      row:
        description: 'Key the row by today or by the build date of the installers'
        required: false
        type: choice
        options: [today, build]
        default: today
      inherit:
        description: 'Continue the CSV file of the newest release that has one, if the ledger release has none'
        required: false
        type: boolean
        default: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts/record-downloads.py
        sparse-checkout-cone-mode: false

    - name: Record downloads
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: >
        python3 .github/scripts/record-downloads.py
        --release '${{ inputs.release }}'
        --ledger '${{ inputs.ledger || inputs.release }}'
        --row '${{ inputs.row }}'
        ${{ inputs.inherit && '--inherit' || '' }}
