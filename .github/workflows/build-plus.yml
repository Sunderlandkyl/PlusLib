name: Build Plus

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
        default: x64
      os:
        required: true
        type: string
      # Dependency versions
      qt-version:
        required: false
        type: string
        default: '5.15.0'
      vtk-cache-key:
        required: true
        type: string
      itk-cache-key:
        required: true
        type: string

      # Plus cache
      plus-cache-key:
        required: false
        type: string
      clear-plus-cache:
        required: false
        type: boolean
        default: false

      # Plus build options
      plus-config:
        required: true
        type: string

      # Uploaded archive name
      archive-name:
        required: false
        type: string
        default: PlusInstaller

      # Repos/tags for PlusLib and PlusApp
      pluslib-repository:
        required: false
        type: string
        default: https://github.com/PlusToolkit/PlusLib.git
      pluslib-tag:
        required: false
        type: string
        default: master
      plusapp-repository:
        required: false
        type: string
        default: https://github.com/PlusToolkit/PlusApp.git
      plusapp-tag:
        required: false
        type: string
        default: master
      # The superbuild that drives the whole build. Overridable so that changes
      # to PlusBuild itself can be tested from a PlusLib workflow run.
      plusbuild-repository:
        required: false
        type: string
        default: https://github.com/PlusToolkit/PlusBuild.git
      plusbuild-tag:
        required: false
        type: string
        default: master

      use-pltools:
        required: false
        type: boolean
        default: false

      # Run the PlusLib test suite (in build/PlusLib-bin) after the build.
      run-tests:
        required: false
        type: boolean
        default: false
      # CDash model for the PlusLib test submission: Experimental or Nightly.
      test-model:
        required: false
        type: string
        default: Experimental
      # Optional CDash track for the PlusLib test submission.
      test-track:
        required: false
        type: string
        default: ''
      # Extra ctest arguments for the PlusLib test run (e.g. -E <regex>).
      ctest-extra-args:
        required: false
        type: string
        default: ''

    secrets:
      pltools-access-token:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.os }}
    permissions:
      actions: write
    env:
      # The open-source Qt 5.15 binaries are x86_64 only, so an Apple silicon
      # runner builds for x86_64 and runs the result under Rosetta. CMake reads
      # this variable on Apple platforms and every sub-project inherits it.
      CMAKE_OSX_ARCHITECTURES: ${{ contains(inputs.os, 'macos') && 'x86_64' || '' }}

    steps:
    # fail-on-cache-miss so that a missing dependency cache fails here rather
    # than much later as a confusing FIND_PACKAGE(VTK) error.
    - name: Restore VTK Cache
      uses: actions/cache/restore@v6
      with:
        path: vtk-install
        key: ${{ inputs.vtk-cache-key }}
        fail-on-cache-miss: true

    - name: Restore ITK Cache
      uses: actions/cache/restore@v6
      with:
        path: itk-install
        key: ${{ inputs.itk-cache-key }}
        fail-on-cache-miss: true

    # actions/cache never overwrites an existing key, so a fixed plus-cache-key
    # (e.g. plus-latest-x64) would otherwise never refresh once created.
    - name: Clear Plus Cache
      if: ${{ inputs.clear-plus-cache && inputs.plus-cache-key != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh cache delete "${{ inputs.plus-cache-key }}" --repo ${{ github.repository }} || true

    - name: Plus Cache
      if: ${{ inputs.plus-cache-key != '' }}
      id: cache-plus
      uses: actions/cache@v6
      with:
        path: build
        key: ${{ inputs.plus-cache-key }}

    # Build tools, the OpenGL and X libraries VTK links against, and the xcb
    # libraries that Qt's platform plugin loads at run time.
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri libxt-dev libxrender-dev libxext-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 libfontconfig1 libdbus-1-3

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -e
        brew install ninja
        # The Qt 5.15 binaries are x86_64, so both the Qt tools and the build
        # they produce need Rosetta on an Apple silicon runner.
        sudo softwareupdate --install-rosetta --agree-to-license

    - name: Install CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: 4.3.4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        dir: ${{ github.workspace }}/Qt
        version: ${{ inputs.qt-version }}
        arch: ${{ runner.os == 'Windows' && (inputs.arch == 'x64' && 'win64_msvc2019_64' || 'win32_msvc2019') || runner.os == 'Linux' && 'gcc_64' || 'clang_64' }}

    # NSIS builds the Windows installer and has no meaning elsewhere.
    - name: Install NSIS
      if: runner.os == 'Windows'
      uses: repolevedavaj/install-nsis@v1.3.0
      with:
        nsis-version: '3.12'

    # Cloned by URL rather than actions/checkout so that a fork can be used
    # without it having to live in the same GitHub organization.
    - name: Clone PlusBuild
      shell: bash
      run: |
        set -e
        git clone "${{ inputs.plusbuild-repository }}" PlusBuild
        # Plain checkout, so that a branch, a tag or a commit all work. With
        # --detach git refuses, because checking out a branch that exists only
        # on the remote also creates a local branch to track it.
        git -C PlusBuild checkout "${{ inputs.plusbuild-tag }}"
        git -C PlusBuild --no-pager log --oneline -1

    - name: Clone PLTools
      if: ${{ inputs.use-pltools }}
      uses: actions/checkout@v7
      with:
        repository: PerkLab/PLTools
        ref: master
        path: PLTools
        token: ${{ secrets.pltools-access-token }}

    # Visual Studio on Windows, Ninja elsewhere. Ninja is single-configuration,
    # so the configuration is chosen here rather than at build time.
    - name: Configure PlusBuild
      shell: bash
      run: |
        set -e
        args=()
        if [ "$RUNNER_OS" = "Windows" ]; then
          args+=(-G "Visual Studio 18 2026" -A "${{ inputs.arch }}")
        else
          args+=(-G Ninja)
        fi

        # install-qt-action exports QT_ROOT_DIR. The CMake variable is spelled
        # Qt5_DIR, and its value is the directory holding Qt5Config.cmake.
        if [ -d "${QT_ROOT_DIR}/lib/cmake/Qt5" ]; then
          args+=("-DQt5_DIR=${QT_ROOT_DIR}/lib/cmake/Qt5")
        fi

        # Where the cached dependency builds were restored to. The callers
        # used to pass these in plus-config, but a Windows path there arrives
        # through a bash command line, where the backslashes are escapes.
        vtk_dir="$GITHUB_WORKSPACE/vtk-install/lib/cmake/vtk"
        if [ -d "$vtk_dir" ]; then
          args+=("-DVTK_DIR=$vtk_dir")
        fi
        itk_dir=$(find "$GITHUB_WORKSPACE/itk-install/lib/cmake" -maxdepth 1 -type d -name 'ITK-*' 2>/dev/null | head -1)
        if [ -n "$itk_dir" ]; then
          args+=("-DITK_DIR=$itk_dir")
        fi

        cmake -S PlusBuild -B build "${args[@]}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLUSLIB_GIT_REPOSITORY=${{ inputs.pluslib-repository }} \
          -DPLUSLIB_GIT_REVISION=${{ inputs.pluslib-tag }} \
          -DPLUSAPP_GIT_REPOSITORY=${{ inputs.plusapp-repository }} \
          -DPLUSAPP_GIT_REVISION=${{ inputs.plusapp-tag }} \
          ${{ inputs.plus-config }}

    - name: Build
      shell: bash
      working-directory: ${{ github.workspace }}/build
      run: |
        set -e
        # --config and -C only mean something for a multi-configuration generator.
        if [ "$RUNNER_OS" = "Windows" ]; then
          cmake --build . --config Release
          ctest -C Release -D Experimental -V
        else
          cmake --build .
          ctest -D Experimental -V
        fi

    # The runners have no GPU, so VTK cannot create a render window. Tests that
    # generate report plots (the calibration algorithm tests) crash without a
    # software OpenGL implementation. This installs Mesa system-wide, and on
    # Linux also starts an X server and exports DISPLAY.
    - name: Setup headless display
      if: ${{ inputs.run-tests }}
      uses: pyvista/setup-headless-display-action@b0bf9f57d62d2b3fee9f1c0e0c7e390f05e97a4e # v5.0.0
      with:
        pyvista: false

    # PlusBuild itself declares no tests; the PlusLib test suite lives in the
    # inner PlusLib-bin build tree and has to be run there.
    # -M/-T rather than -D so that no Update step runs (it would move the
    # checkout off the requested PlusLib revision) and the tree is not rebuilt.
    - name: Test PlusLib
      id: plus-tests
      if: ${{ inputs.run-tests }}
      shell: bash
      working-directory: ${{ github.workspace }}/build/PlusLib-bin
      run: |
        set -e
        args=()
        if [ "$RUNNER_OS" = "Windows" ]; then
          args+=(-C Release)
        fi
        if [ -n "${{ inputs.test-track }}" ]; then
          args+=(--track "${{ inputs.test-track }}")
        fi
        # Word splitting is intended here: the input is a set of arguments,
        # not a single one.
        args+=(${{ inputs.ctest-extra-args }})
        ctest "${args[@]}" -M ${{ inputs.test-model }} -T Start -T Test \
          --output-on-failure --no-compress-output --timeout 600

    # PlusApp has its own test suite and CDash project, in build/PlusApp-bin.
    - name: Test PlusApp
      id: plusapp-tests
      if: ${{ inputs.run-tests && hashFiles('build/PlusApp-bin/CTestTestfile.cmake') != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}/build/PlusApp-bin
      run: |
        set -e
        args=()
        if [ "$RUNNER_OS" = "Windows" ]; then
          args+=(-C Release)
        fi
        if [ -n "${{ inputs.test-track }}" ]; then
          args+=(--track "${{ inputs.test-track }}")
        fi
        ctest "${args[@]}" -M ${{ inputs.test-model }} -T Start -T Test \
          --output-on-failure --no-compress-output --timeout 600

    # Separate from the test step so that a CDash outage cannot fail the job.
    - name: Submit test results to CDash
      if: ${{ always() && steps.plus-tests.outcome != 'skipped' }}
      continue-on-error: true
      shell: bash
      run: |
        cd "${{ github.workspace }}/build/PlusLib-bin"
        ctest -M ${{ inputs.test-model }} -T Submit
        if [ "${{ steps.plusapp-tests.outcome }}" != "skipped" ]; then
          cd "${{ github.workspace }}/build/PlusApp-bin"
          ctest -M ${{ inputs.test-model }} -T Submit
        fi

    - name: Upload test logs
      if: ${{ always() && steps.plus-tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.archive-name }}-TestLogs
        if-no-files-found: warn
        path: |
          build/PlusLib-bin/Testing/Temporary/LastTest*.log
          build/PlusLib-bin/Testing/Temporary/LastTestsFailed*.log
          build/PlusLib-bin/Testing/**/Test.xml
          build/PlusApp-bin/Testing/Temporary/LastTest*.log
          build/PlusApp-bin/Testing/Temporary/LastTestsFailed*.log
          build/PlusApp-bin/Testing/**/Test.xml

    # Puts the MSVC tools on PATH for the NSIS installer build.
    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1

    - name: Package
      if: ${{ hashFiles('build/PlusApp-bin/CPackConfig.cmake') != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}/build/PlusApp-bin
      run: |
        set -e
        if [ "$RUNNER_OS" = "Windows" ]; then
          ./CreatePackage.bat
        else
          ./CreatePackage.sh
        fi

    # Gathered into one directory so that the upload does not have to know
    # which package formats each platform produces. Each pattern is copied on
    # its own, so that one generator failing still surfaces the packages the
    # others produced; the step then fails if nothing at all was collected.
    - name: Collect packages
      if: ${{ hashFiles('build/PlusApp-bin/CPackConfig.cmake') != '' }}
      shell: bash
      run: |
        set -e
        mkdir -p packages
        case "$RUNNER_OS" in
          Windows) patterns="PlusApp-*.exe PlusApp-*.zip" ;;
          Linux)   patterns="PlusApp-*.tar.gz *.deb" ;;
          macOS)   patterns="PlusApp-*.tar.gz PlusApp-*.dmg" ;;
          *)       patterns="PlusApp-*" ;;
        esac
        for pattern in $patterns; do
          # shellcheck disable=SC2086
          if ! cp build/PlusApp-bin/$pattern packages/ 2>/dev/null; then
            echo "No package matched $pattern"
          fi
        done
        if [ -z "$(ls -A packages)" ]; then
          echo "CPack produced no packages at all."
          exit 1
        fi
        ls -l packages

    - name: Upload artifact
      if: ${{ hashFiles('build/PlusApp-bin/CPackConfig.cmake') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.archive-name }}
        if-no-files-found: error
        path: ${{ github.workspace }}/packages/*

    # Delete the packages so that they are not carried in the build cache.
    - name: Delete packages
      if: always()
      shell: bash
      run: |
        rm -rf packages
        rm -rfv build/PlusApp-bin/PlusApp-*.exe build/PlusApp-bin/PlusApp-*.zip
        rm -rfv build/PlusApp-bin/PlusApp-*.tar.gz build/PlusApp-bin/PlusApp-*.dmg
        rm -rfv build/PlusApp-bin/*.deb
        rm -rfv build/PlusApp-bin/_CPack_Packages
