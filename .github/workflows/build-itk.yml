name: Build ITK

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      build-type:
        required: false
        type: string
        default: Release
      itk-hash:
        required: true
        type: string
      build-options:
        required: false
        type: string
      cache-prefix:
        required: false
        type: string
        default: itk

    outputs:
      cache-key:
        value: ${{ jobs.itk.outputs.cache-key }}
      install-path:
        value: ${{ jobs.itk.outputs.install-path }}

jobs:
  itk:
    runs-on: ${{ inputs.os }}
    outputs:
      cache-key: ${{ steps.set-outputs.outputs.cache-key }}
      install-path: ${{ steps.set-outputs.outputs.install-path }}
    env:
      CACHE_KEY: ${{ inputs.cache-prefix }}-${{ inputs.os }}-${{ inputs.arch }}-${{ inputs.itk-hash }}
      # The open-source Qt 5.15 binaries are x86_64 only, so an Apple silicon
      # runner builds for x86_64 throughout.
      CMAKE_OSX_ARCHITECTURES: ${{ contains(inputs.os, 'macos') && 'x86_64' || '' }}

    steps:

      - name: Cache ITK Build
        id: cache-itk
        uses: actions/cache@v6
        with:
          path: itk-install
          lookup-only: true
          key: ${{ env.CACHE_KEY }}

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux' && steps.cache-itk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ make libgl1-mesa-dev libglu1-mesa-dev libxt-dev libxrender-dev libxext-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS' && steps.cache-itk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          brew install ninja
          # Matches the architecture VTK and Plus are built for.
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: Clone ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir itk
          cd itk
          git init
          git remote add origin https://github.com/InsightSoftwareConsortium/ITK.git
          git fetch --depth 1 origin ${{ inputs.itk-hash }}
          git checkout FETCH_HEAD

      - name: Install CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: 4.3.4

      - name: Configure ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          # Visual Studio on Windows, Ninja elsewhere.
          generator=(-G Ninja)
          if [ "$RUNNER_OS" = "Windows" ]; then
            generator=(-G "Visual Studio 18 2026" -A "${{ inputs.arch }}")
          fi
          cmake -S itk -B itk-build "${generator[@]}" \
            -DCMAKE_INSTALL_PREFIX=itk-install \
            -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            ${{ inputs.build-options }}

      - name: Build ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --build itk-build --parallel 4 --config ${{ inputs.build-type }}

      - name: Install ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --install itk-build --config ${{ inputs.build-type }}

      - name: Set Outputs
        id: set-outputs
        shell: bash
        run: |
          echo "cache-key=$CACHE_KEY" >> $GITHUB_OUTPUT
          ITK_DIR=$(find "${GITHUB_WORKSPACE}/itk-install/lib/cmake" -maxdepth 1 -type d -name "ITK-*")
          echo "install-path=${ITK_DIR}" >> $GITHUB_OUTPUT
