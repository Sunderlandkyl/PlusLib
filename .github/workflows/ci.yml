name: Continuous integration

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  ########
  # BUILD AND CACHE VTK
  update_vtk_x64:
    uses: ./.github/workflows/build-vtk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    with:
      vtk-hash: f49a1dbafa60b58ef22f6292ec58370453162192 # v9.6.2
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  # A separate job rather than more entries in the matrix above, so that the
  # Windows build does not have to wait for the Linux and macOS dependencies.
  update_vtk_unix:
    uses: ./.github/workflows/build-vtk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        arch: [x64]
    with:
      vtk-hash: f49a1dbafa60b58ef22f6292ec58370453162192 # v9.6.2
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  update_vtk_static_x64:
    uses: ./.github/workflows/build-vtk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    with:
      vtk-hash: f49a1dbafa60b58ef22f6292ec58370453162192 # v9.6.2
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}
      cache-prefix: vtk-static
      build-options: >-
        -DBUILD_SHARED_LIBS:BOOL=OFF

  update_vtk_Win32:
    uses: ./.github/workflows/build-vtk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [Win32]
    with:
      vtk-hash: f49a1dbafa60b58ef22f6292ec58370453162192 # v9.6.2
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  ########
  # BUILD AND CACHE ITK
  update_itk_x64:
    uses: ./.github/workflows/build-itk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    with:
      itk-hash: f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158 # v5.4.6
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  update_itk_unix:
    uses: ./.github/workflows/build-itk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        arch: [x64]
    with:
      itk-hash: f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158 # v5.4.6
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  update_itk_static_x64:
    uses: ./.github/workflows/build-itk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    with:
      itk-hash: f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158 # v5.4.6
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}
      cache-prefix: itk-static
      build-options: >-
        -DBUILD_SHARED_LIBS:BOOL=OFF

  update_itk_Win32:
    uses: ./.github/workflows/build-itk.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [Win32]
    with:
      itk-hash: f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158 # v5.4.6
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-type: ${{ matrix.build_type }}

  ########
  # BUILD PLUS
  build_plus_x64:
    needs: [update_vtk_x64, update_itk_x64]
    uses: ./.github/workflows/build-plus.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    secrets:
      pltools-access-token: ${{ secrets.PLTOOLS_ACCESS_TOKEN }}
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      pluslib-repository: https://github.com/${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}.git
      pluslib-tag: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # TEMPORARY: the matching PlusBuild and PlusApp branches. Restore the
      # PlusToolkit defaults before this is merged.
      plusbuild-repository: https://github.com/Sunderlandkyl/PlusBuild.git
      plusbuild-tag: cmake-modernization
      plusapp-repository: https://github.com/Sunderlandkyl/PlusApp.git
      plusapp-tag: cmake-modernization
      # Written out rather than read from the dependency job: a matrix job
      # reports the outputs of whichever leg finished last. It has to match
      # the key build-vtk.yml and build-itk.yml compute, hashes included.
      vtk-cache-key: vtk-${{ matrix.os }}-${{ matrix.arch }}-f49a1dbafa60b58ef22f6292ec58370453162192
      itk-cache-key: itk-${{ matrix.os }}-${{ matrix.arch }}-f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158
      run-tests: true
      archive-name: PlusApp-Win64
      plus-config: >-
        -DPLUSBUILD_BUILDNAME_POSTFIX=gh-ci-x64
        -DPLUS_USE_3dConnexion_TRACKER:BOOL=ON
        -DPLUS_USE_EPIPHAN:BOOL=ON
        -DPLUS_USE_PHIDGET_SPATIAL_TRACKER:BOOL=ON
        -DPLUS_USE_NDI:BOOL=ON
        -DPLUS_USE_TextRecognizer:BOOL=ON
        -DPLUS_USE_WITMOTIONTRACKER:BOOL=ON
        -DPLUS_USE_MKV_IO:BOOL=ON
        -DPLUS_ENABLE_VIDEOSTREAMING:BOOL=ON
        -DPLUS_USE_VP9:BOOL=ON
        -DPLUS_USE_MMF_VIDEO:BOOL=ON
        -DPLUS_USE_OPTICAL_MARKER_TRACKER:BOOL=ON
        -DPLUSBUILD_USE_OpenCV:BOOL=ON
        -DPLUS_USE_OpenCV_VIDEO:BOOL=ON
        -DPLUSBUILD_USE_aruco:BOOL=ON

  # Linux and macOS. Only the devices that exist on those platforms are
  # enabled; the Windows job above carries the vendor SDK options.
  build_plus_unix:
    needs: [update_vtk_unix, update_itk_unix]
    uses: ./.github/workflows/build-plus.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        arch: [x64]
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      pluslib-repository: https://github.com/${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}.git
      pluslib-tag: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # TEMPORARY: the matching PlusBuild and PlusApp branches. Restore the
      # PlusToolkit defaults before this is merged.
      plusbuild-repository: https://github.com/Sunderlandkyl/PlusBuild.git
      plusbuild-tag: cmake-modernization
      plusapp-repository: https://github.com/Sunderlandkyl/PlusApp.git
      plusapp-tag: cmake-modernization
      vtk-cache-key: vtk-${{ matrix.os }}-${{ matrix.arch }}-f49a1dbafa60b58ef22f6292ec58370453162192
      itk-cache-key: itk-${{ matrix.os }}-${{ matrix.arch }}-f7ff6ad56d487d9f52e6ba1dbbd9a816a14b5158
      run-tests: true
      archive-name: PlusApp-${{ matrix.os }}
      plus-config: >-
        -DPLUSBUILD_BUILDNAME_POSTFIX=gh-ci-${{ matrix.os }}
        -DPLUS_USE_NDI:BOOL=ON
        -DPLUS_USE_MKV_IO:BOOL=ON
        -DPLUS_ENABLE_VIDEOSTREAMING:BOOL=ON

  build_plus_Win32:
    needs: [update_vtk_Win32, update_itk_Win32]
    uses: ./.github/workflows/build-plus.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [Win32]
    secrets:
      pltools-access-token: ${{ secrets.PLTOOLS_ACCESS_TOKEN }}
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      pluslib-repository: https://github.com/${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}.git
      pluslib-tag: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # TEMPORARY: the matching PlusBuild and PlusApp branches. Restore the
      # PlusToolkit defaults before this is merged.
      plusbuild-repository: https://github.com/Sunderlandkyl/PlusBuild.git
      plusbuild-tag: cmake-modernization
      plusapp-repository: https://github.com/Sunderlandkyl/PlusApp.git
      plusapp-tag: cmake-modernization
      vtk-cache-key: ${{ needs.update_vtk_Win32.outputs.cache-key }}
      itk-cache-key: ${{ needs.update_itk_Win32.outputs.cache-key }}
      run-tests: true
      # The six calibration algorithm tests generate report plots through VTK's
      # OpenGL charts. The 32-bit Mesa software renderer on the GitHub runners
      # corrupts the heap during that rendering (same tests pass on x64 with
      # Mesa, and on 32-bit with a real GPU driver), so they are skipped here.
      ctest-extra-args: -E CenterOfRotationCalibration|SpacingCalibAlgoTest
      archive-name: PlusApp-Win32
      plus-config: >-
        -DPLUSAPP_PACKAGE_EDITION:STRING=""
        -DPLUSBUILD_BUILDNAME_POSTFIX=gh-ci-Win32
        -DPLUSBUILD_DOCUMENTATION:BOOL=OFF
        -DPLUS_USE_3dConnexion_TRACKER:BOOL=ON
        -DPLUS_USE_EPIPHAN:BOOL=ON
        -DPLUS_USE_PHIDGET_SPATIAL_TRACKER:BOOL=ON
        -DPLUS_USE_NDI:BOOL=ON
        -DPLUS_USE_TextRecognizer:BOOL=ON
        -DPLUS_USE_WITMOTIONTRACKER:BOOL=ON
        -DPLUS_USE_MKV_IO:BOOL=ON
        -DPLUS_ENABLE_VIDEOSTREAMING:BOOL=ON
        -DPLUS_USE_VP9:BOOL=ON
        -DPLUS_USE_Ascension3DG:BOOL=ON
        -DPLUS_USE_BRACHY_TRACKER:BOOL=ON
        -DPLUS_USE_MMF_VIDEO:BOOL=ON
        -DPLUS_USE_OPTICAL_MARKER_TRACKER:BOOL=ON
        -DPLUSBUILD_USE_OpenCV:BOOL=ON
        -DPLUSBUILD_USE_aruco:BOOL=ON
        -DPLUS_USE_OpenCV_VIDEO:BOOL=ON

  build_plus_static_x64:
    needs: [update_vtk_static_x64, update_itk_static_x64]
    uses: ./.github/workflows/build-plus.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        arch: [x64]
    secrets:
      pltools-access-token: ${{ secrets.PLTOOLS_ACCESS_TOKEN }}
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      pluslib-repository: https://github.com/${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}.git
      pluslib-tag: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # TEMPORARY: the matching PlusBuild and PlusApp branches. Restore the
      # PlusToolkit defaults before this is merged.
      plusbuild-repository: https://github.com/Sunderlandkyl/PlusBuild.git
      plusbuild-tag: cmake-modernization
      plusapp-repository: https://github.com/Sunderlandkyl/PlusApp.git
      plusapp-tag: cmake-modernization
      vtk-cache-key: ${{ needs.update_vtk_static_x64.outputs.cache-key }}
      itk-cache-key: ${{ needs.update_itk_static_x64.outputs.cache-key }}
      run-tests: true
      archive-name: PlusApp-Static-Win64
      plus-config: >-
        -DPLUSBUILD_BUILDNAME_POSTFIX=gh-static-x64
        -DPLUSBUILD_BUILD_SHARED_LIBS:BOOL=OFF
        -DPLUS_USE_3dConnexion_TRACKER:BOOL=ON
        -DPLUS_USE_EPIPHAN:BOOL=ON
        -DPLUS_USE_PHIDGET_SPATIAL_TRACKER:BOOL=ON
        -DPLUS_USE_NDI:BOOL=ON
        -DPLUS_USE_WITMOTIONTRACKER:BOOL=ON
        -DPLUS_ENABLE_VIDEOSTREAMING:BOOL=ON
        -DPLUS_USE_VP9:BOOL=ON
        -DPLUS_USE_MMF_VIDEO:BOOL=ON
