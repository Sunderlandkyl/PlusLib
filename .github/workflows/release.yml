name: Release

# Builds the installers of a stable release when it is published, uploads
# them to it and adds the table of the devices they support to the release
# notes. The release is tagged Plus-<major>.<minor>.<patch> on the release
# branch of PlusLib; PlusApp and PlusBuild are built from their branch of the
# same name, Plus-<major>.<minor>. Pre-releases are left to the nightly
# workflow.
#
# Run it by hand on the tag of the release to build the installers again. The
# notes written for the release are kept; only the device table is replaced.
# A manual run may build PlusApp and PlusBuild from other refs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      plusapp-ref:
        description: 'PlusApp branch, tag or commit (default: the Plus-<major>.<minor> branch)'
        required: false
        type: string
        default: ''
      plusbuild-ref:
        description: 'PlusBuild branch, tag or commit (default: the Plus-<major>.<minor> branch)'
        required: false
        type: string
        default: ''

jobs:
  prepare:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      plusapp-ref: ${{ steps.check.outputs.plusapp-ref }}
      plusbuild-ref: ${{ steps.check.outputs.plusbuild-ref }}
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: CMakeLists.txt
        sparse-checkout-cone-mode: false

    - name: Check the release
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PLUSAPP_REF: ${{ inputs.plusapp-ref }}
        PLUSBUILD_REF: ${{ inputs.plusbuild-ref }}
      run: |
        set -euo pipefail
        tag=$GITHUB_REF_NAME
        if ! [[ $tag =~ ^Plus-([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "$tag is not a release tag (Plus-<major>.<minor>.<patch>)"
          exit 1
        fi
        version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
        branch="Plus-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

        major=$(sed -n 's/^SET(PLUSLIB_VERSION_MAJOR "\([0-9]*\)")/\1/p' CMakeLists.txt)
        minor=$(sed -n 's/^SET(PLUSLIB_VERSION_MINOR "\([0-9]*\)")/\1/p' CMakeLists.txt)
        patch=$(sed -n 's/^SET(PLUSLIB_VERSION_PATCH "\([0-9]*\)")/\1/p' CMakeLists.txt)
        if [ "$major.$minor.$patch" != "$version" ]; then
          echo "The version in CMakeLists.txt is $major.$minor.$patch, not $version"
          exit 1
        fi
        if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" != "false" ]; then
          echo "$tag is not a published release"
          exit 1
        fi

        # PlusApp and PlusBuild are built from their release branch unless a
        # manual run says otherwise. Check now that the refs exist, not hours
        # later in the build jobs.
        plusapp_ref=${PLUSAPP_REF:-$branch}
        plusbuild_ref=${PLUSBUILD_REF:-$branch}
        for spec in "PlusApp $plusapp_ref" "PlusBuild $plusbuild_ref"; do
          set -- $spec
          if [[ $2 =~ ^[0-9a-f]{40}$ ]]; then
            continue # a commit cannot be listed
          fi
          if ! git ls-remote --exit-code --heads --tags "https://github.com/PlusToolkit/$1.git" "$2" >/dev/null; then
            echo "PlusToolkit/$1 has no branch or tag $2"
            exit 1
          fi
        done
        echo "PlusApp: $plusapp_ref, PlusBuild: $plusbuild_ref"

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "plusapp-ref=$plusapp_ref" >> "$GITHUB_OUTPUT"
        echo "plusbuild-ref=$plusbuild_ref" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build-packages.yml
    secrets:
      pltools-access-token: ${{ secrets.PLTOOLS_ACCESS_TOKEN }}
    with:
      pluslib-tag: ${{ github.sha }}
      plusapp-tag: ${{ needs.prepare.outputs.plusapp-ref }}
      plusbuild-tag: ${{ needs.prepare.outputs.plusbuild-ref }}
      plus-cache-key-prefix: plus-release
      clear-plus-cache: true

  # Upload the installers that were built even if some builds failed, and
  # fail in that case, so that the run can be repeated for the failed builds.
  upload:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Only the script that makes the device table is needed.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts/supported-devices.py
        sparse-checkout-cone-mode: false

    - uses: actions/download-artifact@v8
      with:
        pattern: PlusApp-*
        path: installers

    - name: Upload installers
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        mkdir upload
        for dir in installers/*/; do
          exe=$(find "$dir" -maxdepth 1 -name '*.exe' | head -n 1)
          if [ -z "$exe" ]; then
            echo "Artifact $(basename "$dir") contains no installer"
            exit 1
          fi
          cp "$exe" upload/
        done
        if ! ls upload/*.exe >/dev/null 2>&1; then
          echo "No installers to upload"
          exit 1
        fi
        ls -l upload
        gh release upload "$TAG" upload/*.exe --clobber

        # The table of the devices each installer supports, from the device
        # lists in the artifacts and, for the installers of a previous run
        # that were not rebuilt, from the supported-devices.json asset.
        python3 .github/scripts/supported-devices.py --release "$TAG" --artifacts installers/*/ > devices.md

        # Add the table to the notes of the release, replacing the one of a
        # previous run (between the markers) and keeping everything else.
        gh release view "$TAG" --json body --jq .body | tr -d '\r' \
          | awk '/<!-- supported-devices -->/ { skip = 1 } !skip { print } /<!-- \/supported-devices -->/ { skip = 0 }' \
          | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
        {
          echo
          echo '<!-- supported-devices -->'
          cat devices.md
          echo '<!-- /supported-devices -->'
        } >> notes.md
        gh release edit "$TAG" --notes-file notes.md

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Some builds failed; their installers are missing from the release. Re-run the failed jobs."
          exit 1
        fi
